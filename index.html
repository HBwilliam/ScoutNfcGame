<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ECHO-006</title>
<style>
  :root {
    --matrix: #39ff14;
    --matrix-dim: rgba(57, 255, 20, 0.32);
    --bad: #ff5d6c;
    --muted: #4d6b53;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: "Courier New", Consolas, monospace;
  }

  #matrix {
    position: fixed;
    inset: 0;
    display: block;
  }

  .stage {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 26px;
    padding: 24px;
    text-align: center;
  }

  .code-row {
    display: flex;
    gap: clamp(4px, 1.6vw, 12px);
  }
  .cell {
    font-size: clamp(26px, 8vw, 48px);
    font-weight: 700;
    width: 1ch;
    color: var(--matrix-dim);
    text-shadow: none;
    transition: color 0.2s ease, text-shadow 0.2s ease;
  }
  .cell.locked {
    color: var(--matrix);
    text-shadow: 0 0 8px var(--matrix), 0 0 22px rgba(57,255,20,0.6);
    animation: settle 0.3s ease;
  }
  @keyframes settle {
    0% { transform: scale(1.4); }
    100% { transform: scale(1); }
  }

  .status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    letter-spacing: 1px;
    color: var(--muted);
    text-transform: uppercase;
    min-height: 16px;
  }
  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--muted);
    flex-shrink: 0;
  }
  .dot.scanning { background: var(--matrix); animation: pulse 1.2s infinite ease-in-out; }
  .dot.ok { background: var(--matrix); }
  .dot.err { background: var(--bad); }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.35; transform: scale(0.7); }
  }

  button#scanBtn {
    padding: 12px 28px;
    border-radius: 4px;
    border: 1px solid var(--matrix);
    font-family: inherit;
    font-size: 13px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    font-weight: 700;
    cursor: pointer;
    background: transparent;
    color: var(--matrix);
    transition: background 0.15s ease, color 0.15s ease;
  }
  button#scanBtn:hover { background: rgba(57,255,20,0.1); }
  button#scanBtn.active {
    background: var(--matrix);
    color: #000;
  }

  .reveal {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    opacity: 0;
    height: 0;
    overflow: hidden;
    transition: opacity 0.6s ease;
  }
  .reveal.show {
    opacity: 1;
    height: auto;
  }
  .reveal .tag {
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--matrix);
    text-transform: uppercase;
  }
  .reveal a.ig-link {
    padding: 10px 22px;
    border-radius: 999px;
    background: var(--matrix);
    color: #000;
    font-weight: 700;
    text-decoration: none;
    font-size: 13px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  /* Hidden debug/testing panel — tap the code row 5x to reveal */
  .sim {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .sim.show { display: flex; }
  .sim-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
  }
  .sim-grid button {
    background: transparent;
    color: var(--matrix);
    border: 1px solid var(--muted);
    font-family: inherit;
    font-size: 12px;
    padding: 6px 10px;
    cursor: pointer;
    border-radius: 4px;
  }
  .sim-grid button:hover { border-color: var(--matrix); }
  .reset-btn {
    background: transparent;
    border: 1px solid var(--bad);
    color: var(--bad);
    font-family: inherit;
    font-size: 11px;
    padding: 6px 12px;
    cursor: pointer;
    border-radius: 4px;
  }
</style>
</head>
<body>

<canvas id="matrix"></canvas>

<div class="stage">
  <div id="codeRow" class="code-row"></div>

  <div class="status">
    <span id="statusDot" class="dot"></span>
    <span id="statusText">Idle</span>
  </div>

  <button id="scanBtn">Start Scanning</button>

  <div id="reveal" class="reveal">
    <div class="tag">Access Granted</div>
    <a class="ig-link" id="igLink" href="#" target="_blank" rel="noopener noreferrer">Open Instagram</a>
  </div>

  <div class="sim" id="simPanel">
    <div class="sim-grid" id="simGrid"></div>
    <button class="reset-btn" id="resetBtn">Reset progress</button>
  </div>
</div>

<script>
  // ── Config ──────────────────────────────────────────────
  const TARGET = "ECHO-006".split(""); // one char per tag, id = index
  const TOTAL_TAGS = TARGET.length; // 8
  const INSTAGRAM_URL = "https://instagram.com/REPLACE_ME"; // TODO: set real link
  const STORAGE_KEY = "scoutnfc_unlocked_v2";
  const GLYPHS = "アイウエオカキクケコサシスセソタチツテトABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";

  // ── Matrix rain background ─────────────────────────────
  const canvas = document.getElementById("matrix");
  const ctx = canvas.getContext("2d");
  const fontSize = 16;
  let columns, drops;

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    columns = Math.floor(canvas.width / fontSize);
    drops = new Array(columns).fill(0).map(() => Math.random() * -50);
  }
  resizeCanvas();
  window.addEventListener("resize", resizeCanvas);

  function drawMatrix() {
    ctx.fillStyle = "rgba(0,0,0,0.06)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#0f0";
    ctx.font = fontSize + "px monospace";
    for (let i = 0; i < drops.length; i++) {
      const char = GLYPHS[Math.floor(Math.random() * GLYPHS.length)];
      ctx.fillText(char, i * fontSize, drops[i] * fontSize);
      if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
      drops[i]++;
    }
  }
  setInterval(drawMatrix, 45);

  // ── State ───────────────────────────────────────────────
  let unlocked = loadProgress();
  const cellTimers = new Array(TOTAL_TAGS).fill(null);

  function loadProgress() {
    try {
      const raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
      return new Set(raw.filter((n) => Number.isInteger(n) && n >= 0 && n < TOTAL_TAGS));
    } catch {
      return new Set();
    }
  }
  function saveProgress() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify([...unlocked]));
  }

  // ── DOM refs ────────────────────────────────────────────
  const codeRowEl = document.getElementById("codeRow");
  const statusDot = document.getElementById("statusDot");
  const statusText = document.getElementById("statusText");
  const scanBtn = document.getElementById("scanBtn");
  const revealEl = document.getElementById("reveal");
  const igLink = document.getElementById("igLink");
  const simGrid = document.getElementById("simGrid");
  const resetBtn = document.getElementById("resetBtn");
  const simPanel = document.getElementById("simPanel");

  igLink.href = INSTAGRAM_URL;

  function randomGlyph() {
    return GLYPHS[Math.floor(Math.random() * GLYPHS.length)];
  }

  function buildCells() {
    codeRowEl.innerHTML = "";
    for (let i = 0; i < TOTAL_TAGS; i++) {
      const span = document.createElement("span");
      span.className = "cell";
      span.dataset.id = i;
      codeRowEl.appendChild(span);
    }
  }
  const cells = [];

  function startScramble(i) {
    clearInterval(cellTimers[i]);
    cellTimers[i] = setInterval(() => {
      cells[i].textContent = randomGlyph();
    }, 110 + Math.random() * 90);
  }

  function lockInChar(i) {
    clearInterval(cellTimers[i]);
    cellTimers[i] = null;
    let ticks = 0;
    const burst = setInterval(() => {
      if (ticks < 10) {
        cells[i].textContent = randomGlyph();
        ticks++;
      } else {
        clearInterval(burst);
        cells[i].textContent = TARGET[i];
        cells[i].classList.add("locked");
        checkComplete();
      }
    }, 40);
  }

  function initCells() {
    codeRowEl.querySelectorAll(".cell").forEach((el) => cells.push(el));
    for (let i = 0; i < TOTAL_TAGS; i++) {
      if (unlocked.has(i)) {
        cells[i].textContent = TARGET[i];
        cells[i].classList.add("locked");
      } else {
        startScramble(i);
      }
    }
    checkComplete();
  }

  function checkComplete() {
    if (unlocked.size >= TOTAL_TAGS) {
      revealEl.classList.add("show");
    } else {
      revealEl.classList.remove("show");
    }
  }

  function setStatus(state, text) {
    statusDot.className = "dot" + (state ? " " + state : "");
    statusText.textContent = text;
  }

  function handleScannedId(id, serial) {
    if (id === null || id < 0 || id >= TOTAL_TAGS) {
      setStatus("err", `Unrecognized tag${id !== null ? ` (ID ${id})` : ""}`);
      return;
    }
    if (unlocked.has(id)) {
      setStatus("ok", `Tag ${id} already unlocked`);
      return;
    }
    unlocked.add(id);
    saveProgress();
    lockInChar(id);
    setStatus("ok", `Tag ${id} unlocked (${unlocked.size}/${TOTAL_TAGS})`);
  }

  // ── NFC reading ─────────────────────────────────────────
  // Expects a text record on the tag containing its ID (0-7).
  // Falls back to deriving an ID from the tag's serial number if no
  // matching text record is found.
  function extractId(message, serialNumber) {
    for (const record of message.records) {
      if (record.recordType === "text") {
        const decoder = new TextDecoder(record.encoding || "utf-8");
        const text = decoder.decode(record.data).trim();
        const num = parseInt(text, 10);
        if (!Number.isNaN(num)) return num;
      }
    }
    if (serialNumber) {
      const hex = serialNumber.replace(/:/g, "");
      const n = parseInt(hex.slice(-2), 16);
      if (!Number.isNaN(n)) return n % TOTAL_TAGS;
    }
    return null;
  }

  let abortController = null;

  async function startScan() {
    if (!("NDEFReader" in window)) {
      setStatus("err", "Web NFC not supported (try Chrome on Android, over HTTPS)");
      return;
    }
    try {
      abortController = new AbortController();
      const ndef = new NDEFReader();
      await ndef.scan({ signal: abortController.signal });
      setStatus("scanning", "Scanning…");
      scanBtn.textContent = "Stop Scanning";
      scanBtn.classList.add("active");

      ndef.addEventListener("reading", ({ message, serialNumber }) => {
        const id = extractId(message, serialNumber);
        handleScannedId(id, serialNumber);
      });

      ndef.addEventListener("readingerror", () => {
        setStatus("err", "Failed to read tag — try again");
      });

      abortController.signal.addEventListener("abort", () => {
        setStatus(null, "Idle");
        scanBtn.textContent = "Start Scanning";
        scanBtn.classList.remove("active");
      });
    } catch (err) {
      setStatus("err", "Scan failed: " + err.message);
      scanBtn.textContent = "Start Scanning";
      scanBtn.classList.remove("active");
    }
  }

  scanBtn.addEventListener("click", () => {
    if (abortController && !abortController.signal.aborted) {
      abortController.abort();
    } else {
      startScan();
    }
  });

  resetBtn.addEventListener("click", () => {
    unlocked = new Set();
    saveProgress();
    for (let i = 0; i < TOTAL_TAGS; i++) {
      cells[i].classList.remove("locked");
      startScramble(i);
    }
    checkComplete();
    setStatus(null, "Progress reset");
  });

  function renderSimButtons() {
    simGrid.innerHTML = "";
    for (let id = 0; id < TOTAL_TAGS; id++) {
      const btn = document.createElement("button");
      btn.textContent = TARGET[id] + " (" + id + ")";
      btn.addEventListener("click", () => handleScannedId(id, "SIMULATED"));
      simGrid.appendChild(btn);
    }
  }

  // Tap the code row 5x within 2s to reveal hidden testing tools
  // (simulate scans / reset) without cluttering the live UI.
  let tapCount = 0;
  let tapTimer = null;
  codeRowEl.addEventListener("click", () => {
    tapCount++;
    clearTimeout(tapTimer);
    tapTimer = setTimeout(() => { tapCount = 0; }, 2000);
    if (tapCount >= 5) {
      simPanel.classList.add("show");
      tapCount = 0;
    }
  });

  // ── Init ────────────────────────────────────────────────
  buildCells();
  initCells();
  renderSimButtons();
</script>

</body>
</html>
