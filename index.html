<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>???</title>
<style>
  :root {
    --matrix: #39ff14;
    --matrix-dim: rgba(57, 255, 20, 0.32);
    --bad: #ff5d6c;
    --muted: #4d6b53;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: "Courier New", Consolas, monospace;
  }

  .stage {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 26px;
    padding: 24px;
    text-align: center;
  }

  .code-row {
    display: flex;
    gap: 8px;
  }
  .cell {
    position: relative;
    overflow: hidden;
    border-radius: 4px;
  }
  .cell canvas {
    position: absolute;
    inset: 0;
    transition: opacity 0.3s ease;
  }
  .cell .glyph {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    color: var(--matrix);
    opacity: 0;
    text-shadow: 0 0 8px var(--matrix), 0 0 22px rgba(57,255,20,0.6);
  }
  .cell.locked canvas { opacity: 0; }
  .cell.locked .glyph {
    opacity: 1;
    animation: settle 0.3s ease;
  }
  @keyframes settle {
    0% { transform: scale(1.5); }
    100% { transform: scale(1); }
  }

  .status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    letter-spacing: 1px;
    color: var(--muted);
    text-transform: uppercase;
    min-height: 16px;
  }
  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--muted);
    flex-shrink: 0;
  }
  .dot.scanning { background: var(--matrix); animation: pulse 1.2s infinite ease-in-out; }
  .dot.ok { background: var(--matrix); }
  .dot.err { background: var(--bad); }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.35; transform: scale(0.7); }
  }

  button#scanBtn {
    padding: 12px 28px;
    border-radius: 4px;
    border: 1px solid var(--matrix);
    font-family: inherit;
    font-size: 13px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    font-weight: 700;
    cursor: pointer;
    background: transparent;
    color: var(--matrix);
    transition: background 0.15s ease, color 0.15s ease;
  }
  button#scanBtn:hover { background: rgba(57,255,20,0.1); }
  button#scanBtn.active {
    background: var(--matrix);
    color: #000;
  }

  .reveal {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    opacity: 0;
    height: 0;
    overflow: hidden;
    transition: opacity 0.6s ease;
  }
  .reveal.show {
    opacity: 1;
    height: auto;
  }
  .reveal .tag {
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--matrix);
    text-transform: uppercase;
  }
  .reveal a.ig-link {
    padding: 10px 22px;
    border-radius: 999px;
    background: var(--matrix);
    color: #000;
    font-weight: 700;
    text-decoration: none;
    font-size: 13px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
</style>
</head>
<body>

<div class="stage">
  <div id="codeRow" class="code-row"></div>

  <div class="status">
    <span id="statusDot" class="dot"></span>
    <span id="statusText">Idle</span>
  </div>

  <button id="scanBtn">Start Scanning</button>

  <div id="reveal" class="reveal">
    <div class="tag">Access Granted</div>
    <a class="ig-link" id="igLink" href="#" target="_blank" rel="noopener noreferrer">Open Instagram</a>
  </div>
</div>

<script>
  // ── Config ──────────────────────────────────────────────
  const TARGET = "ECHO-006".split(""); // one char per tag, id = index
  const TOTAL_TAGS = TARGET.length; // 8
  const INSTAGRAM_URL = "https://www.instagram.com/cmpr2026";
  const STORAGE_KEY = "scoutnfc_unlocked_v3";
  const GLYPHS = "アイウエオカキクケコサシスセソタチツテトABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
  const GAP = 8;

  function randomGlyph() {
    return GLYPHS[Math.floor(Math.random() * GLYPHS.length)];
  }

  // ── State ───────────────────────────────────────────────
  let unlocked = loadProgress();

  function loadProgress() {
    try {
      const raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
      return new Set(raw.filter((n) => Number.isInteger(n) && n >= 0 && n < TOTAL_TAGS));
    } catch {
      return new Set();
    }
  }
  function saveProgress() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify([...unlocked]));
  }

  // ── DOM refs ────────────────────────────────────────────
  const codeRowEl = document.getElementById("codeRow");
  const statusDot = document.getElementById("statusDot");
  const statusText = document.getElementById("statusText");
  const scanBtn = document.getElementById("scanBtn");
  const revealEl = document.getElementById("reveal");
  const igLink = document.getElementById("igLink");

  igLink.href = INSTAGRAM_URL;

  // ── Per-cell waterfall columns ──────────────────────────
  // Each character slot hosts its own tiny falling-character
  // stream. The stream freezes and the slot reveals its real
  // character once that tag has been scanned.
  const cells = []; // { root, canvas, ctx, glyph, dropY, running, w, h }

  function buildCells() {
    codeRowEl.innerHTML = "";
    for (let i = 0; i < TOTAL_TAGS; i++) {
      const root = document.createElement("div");
      root.className = "cell";
      root.dataset.id = i;

      const canvas = document.createElement("canvas");
      const glyph = document.createElement("span");
      glyph.className = "glyph";

      root.appendChild(canvas);
      root.appendChild(glyph);
      codeRowEl.appendChild(root);

      cells.push({ root, canvas, ctx: canvas.getContext("2d"), glyph, dropY: 0, running: true, w: 0, h: 0, sized: false });
    }
  }

  function sizeCells() {
    const available = Math.min(window.innerWidth - 48, 520);
    const w = Math.max(22, Math.min(46, Math.floor((available - GAP * (TOTAL_TAGS - 1)) / TOTAL_TAGS)));
    const h = Math.round(w * 3.4);
    const dpr = window.devicePixelRatio || 1;

    codeRowEl.style.gap = GAP + "px";

    cells.forEach((cell) => {
      cell.w = w;
      cell.h = h;
      cell.root.style.width = w + "px";
      cell.root.style.height = h + "px";

      cell.canvas.style.width = w + "px";
      cell.canvas.style.height = h + "px";
      cell.canvas.width = w * dpr;
      cell.canvas.height = h * dpr;
      cell.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      cell.ctx.clearRect(0, 0, w, h);

      if (!cell.sized) {
        cell.dropY = Math.random() * h; // desynced starting position
        cell.sized = true;
      }

      cell.glyph.style.fontSize = Math.round(w * 0.85) + "px";
    });
  }
  window.addEventListener("resize", sizeCells);

  function drawColumn(cell) {
    const { ctx, w, h } = cell;
    const fontSize = Math.max(12, Math.round(w * 0.8));
    ctx.fillStyle = "rgba(0,0,0,0.22)";
    ctx.fillRect(0, 0, w, h);
    ctx.font = fontSize + "px monospace";
    ctx.textAlign = "center";
    ctx.fillStyle = "#39ff14";
    ctx.fillText(randomGlyph(), w / 2, cell.dropY);
    cell.dropY += fontSize;
    if (cell.dropY > h + fontSize) cell.dropY = 0;
  }

  function startColumn(cell) {
    const period = 80 + Math.random() * 70; // desynced fall speed
    const delay = Math.random() * 500; // desynced phase
    setTimeout(() => {
      setInterval(() => {
        if (cell.running) drawColumn(cell);
      }, period);
    }, delay);
  }

  function lockInChar(i) {
    const cell = cells[i];
    cell.running = false;
    let ticks = 0;
    const burst = setInterval(() => {
      if (ticks < 8) {
        cell.glyph.textContent = randomGlyph();
        cell.glyph.style.opacity = 1;
        ticks++;
      } else {
        clearInterval(burst);
        cell.glyph.textContent = TARGET[i];
        cell.root.classList.add("locked");
        checkComplete();
      }
    }, 45);
  }

  function initCells() {
    for (let i = 0; i < TOTAL_TAGS; i++) {
      if (unlocked.has(i)) {
        cells[i].running = false;
        cells[i].glyph.textContent = TARGET[i];
        cells[i].glyph.style.opacity = 1;
        cells[i].root.classList.add("locked");
      }
    }
    checkComplete();
  }

  function checkComplete() {
    revealEl.classList.toggle("show", unlocked.size >= TOTAL_TAGS);
  }

  function setStatus(state, text) {
    statusDot.className = "dot" + (state ? " " + state : "");
    statusText.textContent = text;
  }

  function handleScannedId(id, serial) {
    if (id === null || id < 0 || id >= TOTAL_TAGS) {
      setStatus("err", `Unrecognized tag${id !== null ? ` (ID ${id})` : ""}`);
      return;
    }
    if (unlocked.has(id)) {
      setStatus("ok", `Tag ${id} already unlocked`);
      return;
    }
    unlocked.add(id);
    saveProgress();
    lockInChar(id);
    setStatus("ok", `Tag ${id} unlocked (${unlocked.size}/${TOTAL_TAGS})`);
  }

  // ── NFC reading ─────────────────────────────────────────
  // Expects a text record on the tag containing its ID (0-7).
  // Falls back to deriving an ID from the tag's serial number if no
  // matching text record is found.
  function extractId(message, serialNumber) {
    for (const record of message.records) {
      if (record.recordType === "text") {
        const decoder = new TextDecoder(record.encoding || "utf-8");
        const text = decoder.decode(record.data).trim();
        const num = parseInt(text, 10);
        if (!Number.isNaN(num)) return num;
      }
    }
    if (serialNumber) {
      const hex = serialNumber.replace(/:/g, "");
      const n = parseInt(hex.slice(-2), 16);
      if (!Number.isNaN(n)) return n % TOTAL_TAGS;
    }
    return null;
  }

  let abortController = null;

  async function startScan() {
    if (!("NDEFReader" in window)) {
      setStatus("err", "Web NFC not supported (try Chrome on Android, over HTTPS)");
      return;
    }
    try {
      abortController = new AbortController();
      const ndef = new NDEFReader();
      await ndef.scan({ signal: abortController.signal });
      setStatus("scanning", "Scanning…");
      scanBtn.textContent = "Stop Scanning";
      scanBtn.classList.add("active");

      ndef.addEventListener("reading", ({ message, serialNumber }) => {
        const id = extractId(message, serialNumber);
        handleScannedId(id, serialNumber);
      });

      ndef.addEventListener("readingerror", () => {
        setStatus("err", "Failed to read tag — try again");
      });

      abortController.signal.addEventListener("abort", () => {
        setStatus(null, "Idle");
        scanBtn.textContent = "Start Scanning";
        scanBtn.classList.remove("active");
      });
    } catch (err) {
      setStatus("err", "Scan failed: " + err.message);
      scanBtn.textContent = "Start Scanning";
      scanBtn.classList.remove("active");
    }
  }

  scanBtn.addEventListener("click", () => {
    if (abortController && !abortController.signal.aborted) {
      abortController.abort();
    } else {
      startScan();
    }
  });

  // ── Init ────────────────────────────────────────────────
  buildCells();
  sizeCells();
  initCells();
  cells.forEach(startColumn);
</script>

</body>
</html>
